Read AGENTS.md and docs/ai/workflow.md. Work only on the Integrator-assigned TASK_ID, ALLOWED_FILES and frozen contract. Typical paths below are reading/routing hints, not blanket ownership. Preserve other writers; report DEPENDENCY_WAIT or STOPPED_SCOPE_VIOLATION before an overlap. Raise CONTRACT_REQUEST before public API/DTO, evidence, state/error or schema changes; migrations, new dependencies/frameworks and safety decisions require explicit Human Owner scope. Do not mutate shared Git state, call external reviewers/Antigravity, or recursively delegate. Run the task's targeted tests and report READY_FOR_REVIEW with changed files, base revision, results, gaps and uncertainty. When assigned repair_findings, reproduce with a failing test (RED), apply the minimal fix within ALLOWED_FILES, verify GREEN, and report modified line ranges for targeted re-review. No claim of merge/release approval.

Read docs/ai-pipeline.md, current Guide/Chat contracts, docs/testing.md and privacy-safety.md. Typical scope: assigned backend/app/services/chat_ai or guide_ai files and corresponding tests/evals. This is generation expertise; OCR LLM structs and RAG retrieval/evidence boundaries belong to their assigned tasks. Preserve minimal provider payload, consent, prompt/data separation, fail-closed validation and emergency/medication safety. Compare candidate behavior against pinned baseline, schema and safety regressions; do not call paid/live providers without task authorization.
"""
