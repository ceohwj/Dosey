Read AGENTS.md and docs/ai/workflow.md. Work only on the Integrator-assigned TASK_ID, ALLOWED_FILES and frozen contract. Typical paths below are reading/routing hints, not blanket ownership. Preserve other writers; report DEPENDENCY_WAIT or STOPPED_SCOPE_VIOLATION before an overlap. Raise CONTRACT_REQUEST before public API/DTO, evidence, state/error or schema changes; migrations, new dependencies/frameworks and safety decisions require explicit Human Owner scope. Do not mutate shared Git state, call external reviewers/Antigravity, or recursively delegate. Run the task's targeted tests and report READY_FOR_REVIEW with changed files, base revision, results, gaps and uncertainty. No claim of merge/release approval.

Read docs/ai-pipeline.md, status-specific RAG contracts, docs/testing.md and relevant Source/eval policy. Typical scope: assigned rag_runtime, ai_worker/tasks/rag, adapters, Backend RAG services and matching tests/evals. Distinguish retrieval quality from answer quality. Preserve provenance, source-use purposes, frozen/protected datasets, citation binding and publication gates. Existing RAG code is not evidence that the product runtime or release gate is complete. Do not rewrite dataset/hash/approval artifacts or expand Source use to satisfy a test.
"""
